<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { 
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card { 
      border: none; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
      width: 100%;
      max-width: 500px;
    }
    .licencia-box {
      background-color: #eef2ff;
      border: 2px dashed #4f46e5;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .licencia-code {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #312e81;
    }
    .vencimiento-box {
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

  <div class="card p-4">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-dark mb-1">Consulta de Licencia ALEKS</h3>
      <p class="text-muted small">Ingresa tu matrícula para obtener los datos de tu acceso</p>
    </div>

    <div id="contenedor-alerta"></div>

    <!-- FORMULARIO DE BÚSQUEDA SOLO MATRÍCULA -->
    <div id="form-busqueda">
      <div class="mb-3">
        <label class="form-label text-muted fw-bold">Matrícula</label>
        <input type="text" id="alumno-matricula" class="form-control form-control-lg text-center" placeholder="Ej. A0123456" onkeypress="detectarEnter(event)">
      </div>
      <button class="btn btn-primary w-100 btn-lg fw-bold" id="btn-consultar" onclick="consultarLicencia()">Consultar Licencia</button>
    </div>

    <!-- RESULTADO DE LA CONSULTA -->
    <div id="resultado-alumno" style="display:none;" class="mt-2">
      <div class="alert alert-success text-center fw-bold py-2 mb-3">
        ¡Licencia Activa Encontrada!
      </div>

      <!-- DETALLES DEL ALUMNO Y CURSO -->
      <div class="bg-light p-3 rounded-3 mb-3">
        <div class="mb-1"><strong>Alumno:</strong> <span id="res-nombre" class="text-dark"></span></div>
        <!-- 
        <div class="mb-1"><strong>Materia:</strong> <span id="res-materia" class="text-dark"></span></div>
        <div class="mb-1"><strong>Profesor:</strong> <span id="res-maestro" class="text-dark"></span></div>
         -->
        <div><strong>Nivel y Plan:</strong> <span id="res-nivel-vigencia" class="badge bg-primary"></span></div>
      </div>

      <!-- TARJETA DEL CÓDIGO DE LICENCIA -->
      <div class="licencia-box mb-3">
        <div class="text-muted small fw-bold mb-1">CÓDIGO DE LICENCIA ALEKS</div>
        <div class="licencia-code" id="res-licencia"></div>
      </div>

      <!-- TARJETA DE FECHA DE VENCIMIENTO -->
      <div class="vencimiento-box d-flex justify-content-between align-items-center mb-4">
        <span class="text-danger-emphasis fw-bold small">Fecha limite / Vencimiento:</span>
        <span id="res-vencimiento" class="badge bg-danger fs-6 px-3 py-2"></span>
      </div>

      <button class="btn btn-outline-secondary w-100 fw-bold" onclick="nuevaConsulta()">Realizar otra consulta</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function mostrarAlerta(mensaje, tipo) {
      document.getElementById('contenedor-alerta').innerHTML = `
        <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
          ${mensaje}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }

    function detectarEnter(e) {
      if (e.key === 'Enter') {
        consultarLicencia();
      }
    }

    function consultarLicencia() {
      let m = document.getElementById('alumno-matricula').value.trim();

      if (!m) {
        mostrarAlerta('Por favor ingresa tu matrícula.', 'warning');
        return;
      }

      let btn = document.getElementById('btn-consultar');
      btn.disabled = true;
      btn.innerText = 'Consultando...';

      google.script.run.withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerText = 'Consultar Licencia';

        if (res.exito) {
          document.getElementById('contenedor-alerta').innerHTML = '';
          document.getElementById('form-busqueda').style.display = 'none';
          document.getElementById('resultado-alumno').style.display = 'block';

          document.getElementById('res-nombre').innerText = res.nombreAlumno;
          document.getElementById('res-materia').innerText = res.materia;
          document.getElementById('res-maestro').innerText = res.nombreMaestro;
          document.getElementById('res-nivel-vigencia').innerText = res.nivel + " (" + res.vigencia + ")";
          document.getElementById('res-licencia').innerText = res.licenciaAleks;
          document.getElementById('res-vencimiento').innerText = res.fechaVencimiento; // Muestra la fecha en formato dd/MMM/yyyy
        } else {
          document.getElementById('resultado-alumno').style.display = 'none';
          mostrarAlerta(res.mensaje, 'danger');
        }
      }).buscarAlumnoVista(m);
    }

    function nuevaConsulta() {
      document.getElementById('form-busqueda').style.display = 'block';
      document.getElementById('resultado-alumno').style.display = 'none';
      document.getElementById('alumno-matricula').value = '';
      document.getElementById('contenedor-alerta').innerHTML = '';
    }
  </script>
</body>
</html>
