<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #eef2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-login { width: 100%; max-width: 400px; border-radius: 16px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <div id="contenedor-principal" class="w-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card card-login p-4 bg-white">
            <div class="text-center mb-4">
              <h4 class="fw-bold text-primary">Acceso Administrador</h4>
              <p class="text-muted small">Manejo de Licencias ALEKS</p>
            </div>
            
            <div id="alerta-error" class="alert alert-danger d-none" role="alert"></div>

            <form onsubmit="event.preventDefault(); verificarPassword();">
              <div class="mb-3">
                <label for="admin-pass" class="form-label font-weight-bold">Contraseña</label>
                <input type="password" id="admin-pass" class="form-control form-control-lg" placeholder="••••••••" required>
              </div>
              <button type="submit" id="btn-ingresar" class="btn btn-primary btn-lg w-100 fw-bold">Ingresar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function verificarPassword() {
      let pass = document.getElementById('admin-pass').value;
      let btn = document.getElementById('btn-ingresar');
      let alerta = document.getElementById('alerta-error');
      
      btn.disabled = true;
      btn.innerText = "Verificando...";
      alerta.classList.add('d-none');

      google.script.run.withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerText = "Ingresar";
        
        if (res.exito) {
          document.open();
          document.write(res.html);
          document.close();
        } else {
          alerta.innerText = res.mensaje;
          alerta.classList.remove('d-none');
        }
      }).validarPasswordAdmin(pass);
    }
  </script>
</body>
</html>
